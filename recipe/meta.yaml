package:
  name: pycgm2
  version: "4.4rc1"

source:
  path: ..

build:
  noarch: false
  script: pip install .
  string: py{{ python_version | replace(".", "") }}

requirements:
  build:
    - python {{ python_version }}
    - pip
    - setuptools

  run:
    - python {{ python_version }}
    - pip
    - numpy >=1.25,<1.26 # [py == 310]
    - numpy=1.20     # [py == 39]
    - numpy=1.23     # [py == 311]
    - btk
    - opensim
    - scipy
    - matplotlib-base
    - pandas
    - pytest
    - pytest-mpl
    - scikit-learn
    - seaborn
    - beautifulsoup4
    - yamlordereddictloader
    - openpyxl
    - lxml
    - myst-parser
    - sphinx
    - sphinx-argparse
    - sphinxcontrib-mermaid
    - pydata-sphinx-theme

test:
  imports:
    - pyCGM2
  commands:
    - python -c "import pyCGM2; print(pyCGM2.__version__)"
  requires:
    - pytest
    - pytest-mpl

about:
  home: https://github.com/pyCGM2/pyCGM2
  summary: "The python Conventional Gait Model Library"
  license: CC-BY-SA-4.0
  license_family: OTHER
  maintainer: Fabien LEBOEUF <fabien.leboeuf@chu-nantes.com>

extra:
  recipe-maintainers:
    - fleboeuf
